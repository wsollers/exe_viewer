name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-clang18:
    name: Linux Clang 18 (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [clang18-debug, clang18-release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Clang 18 and GUI/Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            clang-format-18 \
            clang-tidy-18 \
            libc++-18-dev \
            libc++abi-18-dev \
            libclang-rt-18-dev \
            cmake \
            ninja-build \
            pkg-config \
            graphviz \
            libgtk-3-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xorg-dev

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }} -DPEELF_WARNINGS_AS_ERRORS=ON

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Run clang-tidy CppCoreGuidelines gate
        if: matrix.preset == 'clang18-debug'
        run: >
          run-clang-tidy-18
          -j "$(nproc)"
          -p out/build/${{ matrix.preset }}
          -quiet
          libs/peelf_core
          apps/viewer

      - name: Run CTest suite (${{ matrix.preset }})
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure --repeat until-pass:2 --parallel "$(nproc)"

      - name: Verify headless CLI JSON, SARIF & CSV output
        run: |
          ./out/build/${{ matrix.preset }}/apps/viewer/peelf_viewer \
            --headless tests/fixtures/hello.elf \
            --format json --output /tmp/hello_report.json
          ./out/build/${{ matrix.preset }}/apps/viewer/peelf_viewer \
            --headless tests/fixtures/hello.elf \
            --format sarif --output /tmp/hello_report.sarif
          ./out/build/${{ matrix.preset }}/apps/viewer/peelf_viewer \
            --headless tests/fixtures/hello.elf \
            --format csv --output /tmp/hello_report.csv
          test -s /tmp/hello_report.json
          test -s /tmp/hello_report.sarif
          test -s /tmp/hello_report.csv

      - name: Verify CMake install & portable CPack archive
        run: |
          STAGE_DIR="${RUNNER_TEMP}/peelf-install-${{ matrix.preset }}"
          rm -rf "${STAGE_DIR}"
          cmake --install "out/build/${{ matrix.preset }}" --prefix "${STAGE_DIR}"
          test "$("${STAGE_DIR}/bin/peelf_viewer" --version)" = "peelf_viewer 1.0.0"
          "${STAGE_DIR}/bin/peelf_viewer" --headless --summary tests/fixtures/hello.elf >/dev/null
          test -f "${STAGE_DIR}/share/peelf_explorer/resources/theme.ini"
          test -f "${STAGE_DIR}/share/peelf_explorer/resources/bn_decompile.py"
          test -f "${STAGE_DIR}/share/peelf_explorer/resources/PeelfDecompile.java"
          ! env -u LD_LIBRARY_PATH ldd "${STAGE_DIR}/bin/peelf_viewer" | grep -q "not found"
          if [ "${{ matrix.preset }}" = "clang18-release" ]; then
            CPACK_DIR="${RUNNER_TEMP}/peelf-cpack"
            UNPACK_DIR="${RUNNER_TEMP}/peelf-unpacked"
            rm -rf "${CPACK_DIR}" "${UNPACK_DIR}"
            cpack --config "out/build/${{ matrix.preset }}/CPackConfig.cmake" -B "${CPACK_DIR}"
            TARBALL="$(ls "${CPACK_DIR}"/peelf-explorer-*.tar.gz)"
            mkdir -p "${UNPACK_DIR}"
            tar -xzf "${TARBALL}" -C "${UNPACK_DIR}"
            UNPACKED_BIN="$(find "${UNPACK_DIR}" -path '*/bin/peelf_viewer' -type f | head -n 1)"
            test -x "${UNPACKED_BIN}"
            test "$("${UNPACKED_BIN}" --version)" = "peelf_viewer 1.0.0"
            "${UNPACKED_BIN}" --headless --summary tests/fixtures/hello.elf >/dev/null
            ! env -u LD_LIBRARY_PATH ldd "${UNPACKED_BIN}" | grep -q "not found"
            rm -rf "${CPACK_DIR}" "${UNPACK_DIR}"
          fi
          rm -rf "${STAGE_DIR}"

  linux-asan-ubsan:
    name: Linux Clang 18 (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Clang 18 sanitizer runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            libc++-18-dev \
            libc++abi-18-dev \
            libclang-rt-18-dev \
            cmake \
            ninja-build \
            pkg-config \
            graphviz \
            libgtk-3-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xorg-dev

      - name: Configure (clang18-asan-ubsan)
        run: >
          cmake --preset clang18-asan-ubsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DPEELF_WARNINGS_AS_ERRORS=ON

      - name: Build (clang18-asan-ubsan)
        run: cmake --build --preset clang18-asan-ubsan --parallel

      - name: Run CTest suite under ASan + UBSan
        env:
          # Ubuntu 24.04 links libc++abi.so.1 with -Bsymbolic-functions, causing
          # std::system_error::~system_error to bypass ASan's operator delete PLT hook.
          ASAN_OPTIONS: detect_leaks=1:alloc_dealloc_mismatch=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir out/build/clang18-asan-ubsan --output-on-failure --repeat until-pass:2 --parallel 2

  linux-fuzz-smoke:
    name: Linux Clang 18 (libFuzzer + ASan + UBSan Smoke)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Clang 18 libFuzzer & sanitizer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            libc++-18-dev \
            libc++abi-18-dev \
            libclang-rt-18-dev \
            cmake \
            ninja-build \
            pkg-config

      - name: Configure (clang18-fuzz)
        run: cmake --preset clang18-fuzz -DPEELF_WARNINGS_AS_ERRORS=ON

      - name: Build (clang18-fuzz)
        run: cmake --build --preset clang18-fuzz --parallel

      - name: Run 4 libFuzzer + ASan + UBSan smoke harnesses
        env:
          ASAN_OPTIONS: detect_leaks=1:alloc_dealloc_mismatch=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          CORPUS_ROOT="${RUNNER_TEMP}/peelf-fuzz-corpus"
          ART_DIR="${RUNNER_TEMP}/peelf-fuzz-artifacts"
          rm -rf "${CORPUS_ROOT}" "${ART_DIR}"
          mkdir -p "${ART_DIR}"
          for target in fuzz_binary_image fuzz_debug_formats fuzz_crash_dumps fuzz_parsers_dsl; do
            SEED_DIR="${CORPUS_ROOT}/${target}"
            mkdir -p "${SEED_DIR}"
            find tests/fixtures -maxdepth 1 -type f -exec cp {} "${SEED_DIR}/" \;
            echo "=== Smoke fuzzing ${target} ==="
            "./out/build/clang18-fuzz/tests/fuzz/${target}" \
              -max_total_time=10 \
              -max_len=262144 \
              -rss_limit_mb=2048 \
              -timeout=5 \
              -print_final_stats=1 \
              -artifact_prefix="${ART_DIR}/${target}-" \
              "${SEED_DIR}"
          done
          rm -rf "${CORPUS_ROOT}" "${ART_DIR}"

  windows-msvc:
    name: Windows MSVC 2022 (${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure MSVC x64 Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache LunarG Vulkan SDK 1.3.296.0
        id: cache-vulkan-sdk
        uses: actions/cache@v4
        with:
          path: C:/VulkanSDK/1.3.296.0
          key: vulkan-sdk-win64-1.3.296.0

      - name: Setup LunarG Vulkan SDK 1.3.296.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $vkRoot = 'C:/VulkanSDK/1.3.296.0'
          $vkHeader = "$vkRoot/Include/vulkan/vulkan.h"
          $vkLib = "$vkRoot/Lib/vulkan-1.lib"

          if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
            $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-1.3.296.0-Installer.exe'
            $url = 'https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe'
            try {
              Write-Host "Downloading LunarG Vulkan SDK 1.3.296.0 from $url..."
              Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
              if ((Test-Path $installer) -and ((Get-Item $installer).Length -gt 10MB)) {
                $proc = Start-Process -FilePath $installer -ArgumentList @(
                  '--root', $vkRoot,
                  '--accept-licenses',
                  '--default-answer',
                  '--confirm-command',
                  'install',
                  'com.lunarg.vulkan.core'
                ) -Wait -PassThru
                if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
                  $proc = Start-Process -FilePath $installer -ArgumentList @(
                    '--root', $vkRoot,
                    '--accept-licenses',
                    '--default-answer',
                    '--confirm-command',
                    'install'
                  ) -Wait -PassThru
                }
              }
            } catch {
              Write-Warning "LunarG installer failed ($($_.Exception.Message)); falling back to Khronos sources."
            } finally {
              if (Test-Path $installer) {
                Remove-Item -Force $installer -ErrorAction SilentlyContinue
              }
            }
          }

          if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
            Write-Host 'Building Khronos Vulkan-Headers + Vulkan-Loader v1.3.296.0 fallback...'
            $srcBase = Join-Path $env:RUNNER_TEMP 'vulkan-khronos-1.3.296.0'
            if (Test-Path $srcBase) { Remove-Item -Recurse -Force $srcBase }
            New-Item -ItemType Directory -Force -Path $srcBase | Out-Null

            git clone --depth 1 --branch vulkan-sdk-1.3.296.0 https://github.com/KhronosGroup/Vulkan-Headers.git "$srcBase/Vulkan-Headers"
            cmake -S "$srcBase/Vulkan-Headers" -B "$srcBase/build-headers" -G Ninja `
              -DCMAKE_INSTALL_PREFIX="$vkRoot" `
              -DCMAKE_INSTALL_INCLUDEDIR=Include
            cmake --install "$srcBase/build-headers"

            git clone --depth 1 --branch vulkan-sdk-1.3.296.0 https://github.com/KhronosGroup/Vulkan-Loader.git "$srcBase/Vulkan-Loader"
            cmake -S "$srcBase/Vulkan-Loader" -B "$srcBase/build-loader" -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_INSTALL_PREFIX="$vkRoot" `
              -DCMAKE_PREFIX_PATH="$vkRoot" `
              -DCMAKE_INSTALL_INCLUDEDIR=Include `
              -DCMAKE_INSTALL_LIBDIR=Lib `
              -DCMAKE_INSTALL_BINDIR=Bin `
              -DVULKAN_HEADERS_INSTALL_DIR="$vkRoot" `
              -DUSE_MASM=OFF `
              -DBUILD_TESTS=OFF
            cmake --build "$srcBase/build-loader" --parallel
            cmake --install "$srcBase/build-loader"
            Remove-Item -Recurse -Force $srcBase -ErrorAction SilentlyContinue
          }

          if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
            throw "Vulkan SDK verification failed: expected $vkHeader and $vkLib"
          }
          "VULKAN_SDK=$vkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$vkRoot/Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake (${{ matrix.build_type }})
        run: >
          cmake -S . -B out/build/msvc-${{ matrix.build_type }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPEELF_WARNINGS_AS_ERRORS=ON

      - name: Build (${{ matrix.build_type }})
        run: cmake --build out/build/msvc-${{ matrix.build_type }} --parallel -- -k 0

      - name: Run CTest suite (${{ matrix.build_type }})
        shell: pwsh
        run: ctest --test-dir out/build/msvc-${{ matrix.build_type }} --output-on-failure --repeat until-pass:2 --parallel $env:NUMBER_OF_PROCESSORS

      - name: Verify headless CLI JSON, SARIF & CSV output
        shell: pwsh
        run: |
          $exe = "out/build/msvc-${{ matrix.build_type }}/apps/viewer/peelf_viewer.exe"
          $jsonOut = "out/build/msvc-${{ matrix.build_type }}/hello_report.json"
          $sarifOut = "out/build/msvc-${{ matrix.build_type }}/hello_report.sarif"
          $csvOut = "out/build/msvc-${{ matrix.build_type }}/hello_report.csv"
          & $exe --headless tests/fixtures/hello.elf --format json --output $jsonOut
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $jsonOut) -or (Get-Item $jsonOut).Length -eq 0) { throw "Headless JSON failed" }
          & $exe --headless tests/fixtures/hello.elf --format sarif --output $sarifOut
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $sarifOut) -or (Get-Item $sarifOut).Length -eq 0) { throw "Headless SARIF failed" }
          & $exe --headless tests/fixtures/hello.elf --format csv --output $csvOut
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $csvOut) -or (Get-Item $csvOut).Length -eq 0) { throw "Headless CSV failed" }

      - name: Verify CMake install & portable CPack archive (${{ matrix.build_type }})
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = "out/build/msvc-${{ matrix.build_type }}"
          $stageDir = Join-Path $env:RUNNER_TEMP "peelf-install-${{ matrix.build_type }}"
          if (Test-Path $stageDir) { Remove-Item -Recurse -Force $stageDir }
          cmake --install $buildDir --prefix $stageDir
          if ($LASTEXITCODE -ne 0) { throw "cmake --install failed" }
          $exe = Join-Path $stageDir "bin/peelf_viewer.exe"
          $ver = (& $exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $ver -ne "peelf_viewer 1.0.0") {
            throw "Unexpected --version output: '$ver'"
          }
          & $exe --headless --summary tests/fixtures/hello.elf | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installed --headless --summary failed" }
          foreach ($rel in @("bin/peelf_gui.dll", "bin/resources/theme.ini", "bin/resources/bn_decompile.py", "bin/resources/PeelfDecompile.java")) {
            if (-not (Test-Path (Join-Path $stageDir $rel))) {
              throw "Missing installed runtime file: $rel"
            }
          }
          if ("${{ matrix.build_type }}" -eq "Release") {
            $cpackDir = Join-Path $env:RUNNER_TEMP "peelf-cpack"
            $unpackDir = Join-Path $env:RUNNER_TEMP "peelf-unpacked"
            if (Test-Path $cpackDir) { Remove-Item -Recurse -Force $cpackDir }
            if (Test-Path $unpackDir) { Remove-Item -Recurse -Force $unpackDir }
            cpack --config "$buildDir/CPackConfig.cmake" -B $cpackDir
            if ($LASTEXITCODE -ne 0) { throw "cpack failed" }
            $zip = Get-ChildItem -Path $cpackDir -Filter "peelf-explorer-*.zip" | Select-Object -First 1
            if (-not $zip) { throw "CPack ZIP archive not generated" }
            Expand-Archive -Path $zip.FullName -DestinationPath $unpackDir -Force
            $unpackedExe = Get-ChildItem -Path $unpackDir -Recurse -Filter "peelf_viewer.exe" | Select-Object -First 1
            if (-not $unpackedExe) { throw "Unpacked peelf_viewer.exe not found" }
            $unpackedVer = (& $unpackedExe.FullName --version).Trim()
            if ($LASTEXITCODE -ne 0 -or $unpackedVer -ne "peelf_viewer 1.0.0") {
              throw "Unexpected unpacked --version output: '$unpackedVer'"
            }
            & $unpackedExe.FullName --headless --summary tests/fixtures/hello.elf | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Unpacked --headless --summary failed" }
            Remove-Item -Recurse -Force $cpackDir, $unpackDir
          }
          Remove-Item -Recurse -Force $stageDir
