name: PE/ELF Explorer CI

on:
  push:
    branches:
      - main
      - fix/robust-io-and-disassembly-ids
  pull_request:

permissions:
  contents: read

jobs:
  linux-clang18:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Clang 18, libc++, Vulkan, and GLFW prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 libc++-18-dev libc++abi-18-dev \
            cmake ninja-build pkg-config git graphviz \
            libvulkan-dev libgtk-3-dev \
            libwayland-dev libxkbcommon-dev \
            xorg-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev

      - name: Configure
        run: cmake --preset clang18-debug -DPEELF_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset clang18-debug --parallel 2

      - name: Test parser, patching, navigation, disassembly, and graph code
        run: ctest --test-dir out/build/clang18-debug --output-on-failure
