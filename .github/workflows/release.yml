name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  package-linux:
    name: Linux x86_64 Release TGZ (Clang 18)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Clang 18 and GUI/Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 \
            libc++-18-dev \
            libc++abi-18-dev \
            libclang-rt-18-dev \
            cmake \
            ninja-build \
            pkg-config \
            graphviz \
            libgtk-3-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            xorg-dev

      - name: Configure (clang18-release)
        run: cmake --preset clang18-release -DPEELF_WARNINGS_AS_ERRORS=ON

      - name: Build (clang18-release)
        run: cmake --build --preset clang18-release --parallel

      - name: Run CTest suite (clang18-release)
        run: ctest --test-dir out/build/clang18-release --output-on-failure --parallel "$(nproc)"

      - name: Package TGZ & smoke-test unpacked archive
        run: |
          rm -rf dist "${RUNNER_TEMP}/peelf-release-check"
          cpack --config out/build/clang18-release/CPackConfig.cmake -B dist
          TARBALL="$(ls dist/peelf-explorer-*.tar.gz)"
          mkdir -p "${RUNNER_TEMP}/peelf-release-check"
          tar -xzf "${TARBALL}" -C "${RUNNER_TEMP}/peelf-release-check"
          UNPACKED_BIN="$(find "${RUNNER_TEMP}/peelf-release-check" -path '*/bin/peelf_viewer' -type f | head -n 1)"
          UNPACKED_GUI="$(find "${RUNNER_TEMP}/peelf-release-check" -name 'libpeelf_gui.so' -type f | head -n 1)"
          test -x "${UNPACKED_BIN}"
          test -f "${UNPACKED_GUI}"
          VERSION_OUT="$("${UNPACKED_BIN}" --version)"
          echo "Unpacked Linux binary version: ${VERSION_OUT}"
          test "${VERSION_OUT}" = "peelf_viewer 1.0.0"
          "${UNPACKED_BIN}" --headless --summary tests/fixtures/hello.elf >/dev/null
          ! env -u LD_LIBRARY_PATH ldd "${UNPACKED_BIN}" | grep -q "not found"
          ! env -u LD_LIBRARY_PATH ldd "${UNPACKED_GUI}" | grep -q "not found"
          rm -rf "${RUNNER_TEMP}/peelf-release-check"

      - name: Upload Linux TGZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/peelf-explorer-*.tar.gz
          if-no-files-found: error

  package-windows:
    name: Windows x64 Release ZIP (MSVC 2022)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure MSVC x64 Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache LunarG Vulkan SDK 1.3.296.0
        id: cache-vulkan-sdk
        uses: actions/cache@v4
        with:
          path: C:/VulkanSDK/1.3.296.0
          key: vulkan-sdk-win64-1.3.296.0

      - name: Setup LunarG Vulkan SDK 1.3.296.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $vkRoot = 'C:/VulkanSDK/1.3.296.0'
          $vkHeader = "$vkRoot/Include/vulkan/vulkan.h"
          $vkLib = "$vkRoot/Lib/vulkan-1.lib"

          if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
            $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-1.3.296.0-Installer.exe'
            $url = 'https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe'
            try {
              Write-Host "Downloading LunarG Vulkan SDK 1.3.296.0 from $url..."
              Invoke-WebRequest -Uri $url -OutFile $installer -MaximumRetryCount 3 -RetryIntervalSec 5
              if ((Test-Path $installer) -and ((Get-Item $installer).Length -gt 10MB)) {
                $proc = Start-Process -FilePath $installer -ArgumentList @(
                  '--root', $vkRoot,
                  '--accept-licenses',
                  '--default-answer',
                  '--confirm-command',
                  'install',
                  'com.lunarg.vulkan.core'
                ) -Wait -PassThru
                if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
                  $proc = Start-Process -FilePath $installer -ArgumentList @(
                    '--root', $vkRoot,
                    '--accept-licenses',
                    '--default-answer',
                    '--confirm-command',
                    'install'
                  ) -Wait -PassThru
                }
              }
            } catch {
              Write-Warning "LunarG installer failed ($($_.Exception.Message)); falling back to Khronos sources."
            } finally {
              if (Test-Path $installer) {
                Remove-Item -Force $installer -ErrorAction SilentlyContinue
              }
            }
          }

          if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
            Write-Host 'Building Khronos Vulkan-Headers + Vulkan-Loader v1.3.296.0 fallback...'
            $srcBase = Join-Path $env:RUNNER_TEMP 'vulkan-khronos-1.3.296.0'
            if (Test-Path $srcBase) { Remove-Item -Recurse -Force $srcBase }
            New-Item -ItemType Directory -Force -Path $srcBase | Out-Null

            git clone --depth 1 --branch vulkan-sdk-1.3.296.0 https://github.com/KhronosGroup/Vulkan-Headers.git "$srcBase/Vulkan-Headers"
            cmake -S "$srcBase/Vulkan-Headers" -B "$srcBase/build-headers" -G Ninja `
              -DCMAKE_INSTALL_PREFIX="$vkRoot" `
              -DCMAKE_INSTALL_INCLUDEDIR=Include
            cmake --install "$srcBase/build-headers"

            git clone --depth 1 --branch vulkan-sdk-1.3.296.0 https://github.com/KhronosGroup/Vulkan-Loader.git "$srcBase/Vulkan-Loader"
            cmake -S "$srcBase/Vulkan-Loader" -B "$srcBase/build-loader" -G Ninja `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_INSTALL_PREFIX="$vkRoot" `
              -DCMAKE_PREFIX_PATH="$vkRoot" `
              -DCMAKE_INSTALL_INCLUDEDIR=Include `
              -DCMAKE_INSTALL_LIBDIR=Lib `
              -DCMAKE_INSTALL_BINDIR=Bin `
              -DVULKAN_HEADERS_INSTALL_DIR="$vkRoot" `
              -DUSE_MASM=OFF `
              -DBUILD_TESTS=OFF
            cmake --build "$srcBase/build-loader" --parallel
            cmake --install "$srcBase/build-loader"
            Remove-Item -Recurse -Force $srcBase -ErrorAction SilentlyContinue
          }

          if (-not ((Test-Path $vkHeader) -and (Test-Path $vkLib))) {
            throw "Vulkan SDK verification failed: expected $vkHeader and $vkLib"
          }
          "VULKAN_SDK=$vkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$vkRoot/Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake (Release)
        run: >
          cmake -S . -B out/build/msvc-Release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPEELF_WARNINGS_AS_ERRORS=ON

      - name: Build (Release)
        run: cmake --build out/build/msvc-Release --parallel -- -k 0

      - name: Run CTest suite (Release)
        shell: pwsh
        run: ctest --test-dir out/build/msvc-Release --output-on-failure --parallel $env:NUMBER_OF_PROCESSORS

      - name: Package ZIP & smoke-test unpacked archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          $checkDir = Join-Path $env:RUNNER_TEMP "peelf-release-check"
          if (Test-Path $checkDir) { Remove-Item -Recurse -Force $checkDir }
          cpack --config out/build/msvc-Release/CPackConfig.cmake -B dist
          if ($LASTEXITCODE -ne 0) { throw "cpack failed" }
          $zip = Get-ChildItem -Path dist -Filter "peelf-explorer-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Release ZIP archive was not created" }
          Expand-Archive -Path $zip.FullName -DestinationPath $checkDir -Force
          $exe = Get-ChildItem -Path $checkDir -Recurse -Filter "peelf_viewer.exe" | Select-Object -First 1
          if (-not $exe) { throw "Unpacked peelf_viewer.exe missing" }
          $binDir = $exe.DirectoryName
          foreach ($rel in @("peelf_gui.dll", "resources/theme.ini", "resources/bn_decompile.py", "resources/PeelfDecompile.java")) {
            if (-not (Test-Path (Join-Path $binDir $rel))) {
              throw "Unpacked archive missing $rel"
            }
          }
          $ver = (& $exe.FullName --version).Trim()
          Write-Host "Unpacked Windows binary version: $ver"
          if ($LASTEXITCODE -ne 0 -or $ver -ne "peelf_viewer 1.0.0") {
            throw "Unexpected --version output: '$ver'"
          }
          & $exe.FullName --headless --summary tests/fixtures/hello.elf | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unpacked --headless --summary failed" }
          Remove-Item -Recurse -Force $checkDir

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/peelf-explorer-*.zip
          if-no-files-found: error

  release:
    name: Checksums & GitHub Release
    needs: [package-linux, package-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate and verify SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum peelf-explorer-*.tar.gz peelf-explorer-*.zip | tee SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload combined release bundle
        uses: actions/upload-artifact@v4
        with:
          name: peelf-explorer-release-bundle
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
